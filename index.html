<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENJOY YOUR TIME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0a12;
            --card-bg: rgba(18, 18, 32, 0.6);
            --neon-blue: #00f0ff;
            --neon-purple: #b300ff;
            --neon-pink: #ff00a6;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }
        body {
            font-family: 'Orbitron', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(179, 0, 255, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
        }

        .loader { position: fixed; inset: 0; z-index: 9999; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; transition: opacity 0.8s ease, visibility 0.8s; }
        .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-spinner { width: 60px; height: 60px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--neon-blue); animation: spin 1s linear infinite; box-shadow: 0 0 30px var(--neon-blue); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .header { text-align: center; padding: 4rem 1.5rem 2rem; position: relative; }
        .header h1 {
            font-size: clamp(2rem, 6vw, 4rem); font-weight: 900;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            background-size: 300% 300%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .header p { color: var(--text-secondary); margin-top: 0.5rem; font-size: 1rem; letter-spacing: 2px; }

        .controls { max-width: 1200px; margin: 0 auto 2rem; padding: 0 1rem; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        .search-wrap { flex: 1; min-width: 250px; position: relative; background: var(--card-bg); border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid var(--glass-border); padding: 0.5rem 1.5rem; display: flex; align-items: center; box-shadow: var(--shadow-glow); }
        .search-wrap i { color: var(--text-secondary); }
        .search-wrap input { background: transparent; border: none; padding: 0.8rem; width: 100%; color: #fff; font-family: inherit; outline: none; }

        .category-nav { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-bottom: 2rem; }
        .category-btn { background: var(--card-bg); color: var(--text-secondary); padding: 0.6rem 1.5rem; border-radius: 30px; cursor: pointer; border: 1px solid transparent; font-family: inherit; font-weight: 700; font-size: 0.85rem; backdrop-filter: blur(4px); }
        .category-btn:hover, .category-btn.active { background: rgba(0, 240, 255, 0.1); color: #fff; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); transform: translateY(-2px); }

        .game-grid { max-width: 1400px; margin: 0 auto; padding: 0 1rem 4rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.8rem; }
        .game-card { background: var(--card-bg); border-radius: 24px; overflow: hidden; border: 1px solid var(--glass-border); backdrop-filter: blur(10px); text-decoration: none; color: #fff; display: flex; flex-direction: column; position: relative; transform: translateY(0); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--neon-blue); box-shadow: 0 12px 40px rgba(0, 240, 255, 0.25); }
        .game-card .img-wrap { width: 100%; height: 180px; overflow: hidden; background: #16162a; position: relative; display: flex; align-items: center; justify-content: center; }
        .game-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .game-card:hover img { transform: scale(1.1); }
        .game-card .badge { position: absolute; top: 12px; right: 12px; background: var(--neon-pink); color: #fff; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .game-card .info { padding: 1.2rem 1.5rem 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .game-card h3 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
        .game-card .cat-tag { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.3rem; }
        .game-card .play-icon { margin-top: auto; align-self: flex-start; background: var(--neon-blue); color: var(--bg-dark); padding: 0.4rem 1.2rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; margin-top: 1rem; }
        .game-card:hover .play-icon { background: #fff; }

        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
            .game-card .img-wrap { height: 130px; }
            .game-card .info { padding: 0.8rem 1rem 1rem; }
            .game-card h3 { font-size: 0.9rem; }
            .game-card .play-icon { font-size: 0.6rem; padding: 0.3rem 1rem; }
            .category-btn { padding: 0.4rem 1rem; font-size: 0.7rem; }
        }
        .img-placeholder { display: flex; align-items: center; justify-content: center; flex-direction: column; color: rgba(255,255,255,0.2); font-size: 4rem; width: 100%; height: 100%; background: linear-gradient(135deg, #16162a, #222244); }
    </style>
</head>
<body>

    <div class="loader" id="loader"><div class="loader-spinner"></div></div>

    <header class="header">
        <h1>🎮 ENJOY YOUR TIME</h1>
        <p>CREATED BY ABDULLAH BIN FAHAD</p>
    </header>

    <div class="controls">
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search for games...">
        </div>
    </div>

    <div class="category-nav" id="categoryNav">
        <button class="category-btn active" data-cat="all">All Games</button>
        <button class="category-btn" data-cat="Action">Action</button>
        <button class="category-btn" data-cat="Puzzle">Puzzle</button>
        <button class="category-btn" data-cat="Arcade">Arcade</button>
        <button class="category-btn" data-cat="Mind">Mind</button>
        <button class="category-btn" data-cat="Skill">Skill</button>
        <button class="category-btn" data-cat="Word">Word</button>
        <button class="category-btn" data-cat="Casual">Casual</button>
    </div>

    <div class="game-grid" id="gameGrid"></div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 300);
        });

        // --- GAME DATA WITH DIRECT WEB IMAGES ---
        const gamesData = [
            { name: "Laser Archery Challenge", folder: "Archery-Game", cat: "Action", badge: "NEW", img: "https://static.vecteezy.com/system/resources/thumbnails/002/538/807/small/happy-character-playing-archery-game-vector.jpg" },
            { name: "Neon Pong Master", folder: "Ping-Pong-Game", cat: "Action", img: "https://t3.ftcdn.net/jpg/13/80/99/62/360_F_1380996291_jEE9ieZHHm8DPjvVjDgV5Alvg5WWmkY5.jpg" },
            { name: "Fruit Ninja Blitz", folder: "Fruit-Slicer-Game", cat: "Action", img: "https://www.coolmathgames.com/sites/default/files/styles/mobile_game_image/public/FruitNinja_OG-Logo.jpg.webp?itok=p9HjDBpn" },
            { name: "Mole Whackdown", folder: "Whack-A-Mole-Game", cat: "Action", img: "https://m.media-amazon.com/images/I/81kK1bQU9TL.jpg" },
            
            { name: "Candy Crush Saga X", folder: "Candy-Crush-Game", cat: "Puzzle", badge: "HOT", img: "https://i.pinimg.com/originals/71/d6/45/71d645fd24bcd94c5cd09a77a24bdfd5.jpg" },
            { name: "Minefield Survival Pro", folder: "Minesweeper-Game", cat: "Puzzle", img: "https://thumbs.dreamstime.com/b/mine-146336339.jpg" },
            { name: "Tetris Quantum", folder: "Tetris-Game", cat: "Puzzle", img: "https://img.freepik.com/premium-vector/brick-retro-tetris-game_79145-60.jpg?semt=ais_items_boosted&w=740" },
            { name: "2048 Infinity", folder: "2048-Game", cat: "Puzzle", img: "https://www.bestgames.com/cdn-cgi/image/quality=78,format=auto/thumb/Chain-Disk-2048.jpg" },

            { name: "Neon Snake Xtreme", folder: "Snake-Game", cat: "Arcade", img: "https://www.shutterstock.com/image-vector/nokias-classic-snake-mobile-game-260nw-2391933343.jpg" },
            { name: "Laser Breakout", folder: "Breakout-Game", cat: "Arcade", img: "https://www.coolmathgames.com/sites/default/files/2022-11/Arcade%20Games%20Atari%20Breakout%20Gameplay.gif" },
            { name: "Flappy Bird Reloaded", folder: "Flappy-Bird-Game", cat: "Arcade", img: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExdjlnaWxxM3V5bnl6NmRibHl0b2RiYzltN2R5NzlvbnE4M29vd2xjZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/euuaA2cwLEUuI/200.gif" },
            { name: "Cyber Road Crossing", folder: "Crossy-Road-Game", cat: "Arcade", img: "https://media.tenor.com/RCVH4SPD2WoAAAAM/crossing-road-jumping-chicken.gif" },

            { name: "Memory Matrix Pro", folder: "Memory-Card-Game", cat: "Mind", img: "https://i.pinimg.com/originals/00/78/ef/0078ef0c33bc4604b153707df2bcd8ac.jpg" },
            { name: "Quantum Tic-Tac-Toe", folder: "Tic-Tac-Toe", cat: "Mind", img: "https://media.istockphoto.com/id/670031790/vector/tic-tac-toe-painted-grunge-ink-blots-brush-texture-isolated-background-handmade-design.jpg?s=612x612&w=0&k=20&c=FsVCofCXIPx1erU36PZA7TzDyiwszUvvsA0hhlESuns=" },
            { name: "Connect 4 Championship", folder: "Connect-Four-Game", cat: "Mind", img: "https://github.com/lukeg90/connect-four/raw/master/connect-four.gif" },
            { name: "Simon's Neon Challenge", folder: "Simon-Says-Game", cat: "Mind", img: "https://media.tenor.com/KPTI9TNVD-UAAAAM/sml-jeffy.gif" },
            { name: "Cyber Chess Masters", folder: "Chess", cat: "Mind", img: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOTlxN2d6Nng1bWhtZGlnNDczd3NuZmExZjg3djNkdzRzM2dvdnAxbCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/ePuFaLL6VnQcx1QBSD/giphy.gif" },

            { name: "Sky Tower Builder", folder: "Tower-Blocks", cat: "Skill", img: "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExNTk4NzFkNGlyY2M4ZGttNzUybDBvejBoNDh3bTBpZ29jbXQxZmZldCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Cwf290yH98VbpeRqe0/giphy.gif" },
            { name: "Neon Labyrinth", folder: "Tilting-Maze-Game", cat: "Skill", img: "https://codetap.org/storage/projects/tilting-maze-game.png" },
            { name: "Bug Zapper Pro", folder: "Insect-Catch-Game", cat: "Skill", img: "https://codetap.org/storage/projects/insect-catch-game.png" },
            { name: "Shape Shifter Challenge", folder: "Shape-Clicker-Game", cat: "Skill", img: "https://img.itch.zone/aW1hZ2UvMzU0MDkxNS8yMTA4NzQ2Ni5wbmc=/347x500/hg6g4D.png" },

            { name: "Hangman Ultimate", folder: "Hangman-Game", cat: "Word", img: "https://www.wordgames.org/wp-content/uploads/2023/06/00db99bb5c4846a4bfc1e3ef103b41be-512x384.jpeg" },
            { name: "Typing Dojo Master", folder: "Typing-Game", cat: "Word", img: "https://gifdb.com/images/thumbnail/nerd-ginger-cat-typing-8308pf65yrgevcln.gif" },
            { name: "Speed Typing Showdown", folder: "Speed-Typing-Game", cat: "Word", img: "https://media.tenor.com/LfB55ppLnUoAAAAM/typing.gif" },
            { name: "Number Ninja", folder: "Type-Number-Guessing-Game", cat: "Word", img: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExcGtvdmhwb2ZnNnJzbnN4MWdlazh0ZTlxd284NXl6dTY2dHE2am56cCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/JdFEeta1hLNnO/giphy.gif" },

            { name: "Rock Paper Scissors Royale", folder: "Rock-Paper-Scissors", cat: "Casual", img: "https://gifdb.com/images/high/animated-guy-playing-rock-paper-scissors-with-big-hand-bafje8p8taqsiavy.gif" },
            { name: "Dice King Challenge", folder: "Dice-Roll-Simulator", cat: "Casual", img: "https://media.tenor.com/sUiwSBs8S6QAAAAm/dice-game.webp" },
            { name: "Emoji Blitz Catcher", folder: "Emoji-Catcher-Game", cat: "Casual", img: "https://media.tenor.com/1kytRQvIpmcAAAAm/cowboy-cowboy-sad.webp" },
            { name: "Trivia Mastermind", folder: "Quiz-Game", cat: "Casual", img: "https://media.gettyimages.com/id/165768645/vector/thinking-doodles.jpg?s=612x612&w=0&k=20&c=vsJMwrZY29JjkEoA4udy5bPg708p45Rcy_rrLHCB_Vw=" },
            { name: "Speak Number Guess", folder: "Speak-Number-Guessing-Game", cat: "Casual", img: "https://i.pinimg.com/originals/99/d9/23/99d9239aafdc5dd180eeae9bc30dcc6a.jpg" }
        ];

        const grid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.category-btn');
        let currentCategory = 'all';

        function renderGames(category = 'all', query = '') {
            grid.innerHTML = '';
            const filtered = gamesData.filter(game => {
                const matchCat = category === 'all' || game.cat === category;
                const matchSearch = game.name.toLowerCase().includes(query.toLowerCase());
                return matchCat && matchSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-secondary); font-size: 1.2rem;"><i class="fas fa-ghost" style="font-size: 3rem; display: block; margin-bottom: 1rem;"></i>No games found...</div>`;
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('a');
                card.href = `${game.folder}/`;
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="img-wrap">
                        <img src="${game.img}" alt="${game.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                        <div class="img-placeholder" style="display:none;">🎮</div>
                        ${game.badge ? `<span class="badge">${game.badge}</span>` : ''}
                    </div>
                    <div class="info">
                        <h3>${game.name}</h3>
                        <span class="cat-tag"><i class="fas fa-tag"></i> ${game.cat}</span>
                        <span class="play-icon">PLAY <i class="fas fa-arrow-right"></i></span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                renderGames(currentCategory, searchInput.value);
            });
        });

        searchInput.addEventListener('input', (e) => {
            renderGames(currentCategory, e.target.value);
        });

        renderGames();
    </script>
</body>
</html>
